# Server-only overlay, merged on top of docker-compose.yml at deploy time:
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod-demo up -d --build`
#
# Everything here is appbox-specific infrastructure that must never leak into
# the base file, because that file is also what every local dev and CI run
# through `docker compose up`/`config` — a hard-required var or an
# unbuildable image here would break that for everyone (as it briefly did).

services:
  mail-relay:
    build:
      context: ./services/smtp-relay
    restart: unless-stopped
    environment:
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-freeburger.team@gmail.com}
      GMAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:?MAIL_SMTP_PASSWORD must be set}
      SENDER_ADDRESS: support@realgo.dev
      SMTP_LISTEN_HOST: 0.0.0.0
      SMTP_LISTEN_PORT: "2526"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Demo identities stay available in the base local stack, but are not
  # started by the production `prod-demo` profile. Run this separate profile
  # explicitly only when a disposable public demo really needs seeded users.
  seed-users:
    profiles: ["prod-demo-users"]
    environment:
      APP_ENV: production

  # VPN gateway: Cloudflare (fronting Groq's API) 403s requests from this
  # network's address space with a bot-management challenge, regardless of
  # API key/model/User-Agent — evidence points to IP/ASN reputation, not
  # anything wrong with the request itself. sing-box tunnels outbound TCP
  # through a VLESS/Reality subscription (foreign exit) via an iptables
  # transparent REDIRECT; api (below) shares this container's netns so its
  # public egress — Groq calls in particular — rides the tunnel, while
  # private-range destinations (postgres/redis/the docker network itself)
  # are excluded and stay direct.
  #
  # Deliberately NOT built from this repo: the image is built once directly
  # on the server (source lives at /opt/vpngw-gateway on appbox, outside any
  # git repo) and referenced here by tag. This is host/network infrastructure
  # for appbox, not application code — tweaking sing-box/iptables internals
  # shouldn't need a PR+CI+deploy cycle in the product repo. Rebuild after
  # editing the source there: `docker build -t vpngw:local /opt/vpngw-gateway`.
  vpngw:
    image: vpngw:local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      VPN_SUB_URL: ${VPN_SUB_URL:?VPN_SUB_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthy only once traffic actually egresses through the VLESS tunnel: this
    # curl runs in vpngw's netns and is itself redirected through sing-box.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "8", "-o", "/dev/null", "https://www.gstatic.com/generate_204"]
      interval: 15s
      timeout: 12s
      retries: 20
      start_period: 25s
    # api shares this netns and listens on 8080; expose it here since api's
    # own service block has no network attachment of its own to expose from.
    expose:
      - "8080"
    networks:
      default:
      realgo-mail:

  api:
    network_mode: "service:vpngw"
    environment:
      APP_ENV: production
      MAIL_SMTP_HOST: mail-relay
      MAIL_SMTP_PORT: "2526"
      MAIL_SMTP_USERNAME: ""
      MAIL_SMTP_PASSWORD: ""
      MAIL_SMTP_TLS_MODE: none
    depends_on:
      vpngw:
        condition: service_healthy
      mail-relay:
        condition: service_healthy

  # The product presentation runs in prod exactly as it does locally — the base
  # service definition already carries everything it needs. It is repeated here
  # on purpose, for two things that only matter on the server:
  #
  #  - `pull_policy: build`. The deploy workflow runs
  #    `docker compose ... pull --ignore-buildable || true` before `up`. This
  #    image has no registry to pull from, so being explicit keeps that step
  #    honest instead of relying on the `|| true` to swallow a miss.
  #  - it stays on the default compose network, deliberately NOT
  #    `network_mode: service:vpngw` like api. The deck is pure static content
  #    with zero outbound calls, so routing it through the VLESS tunnel would
  #    add a hop and a failure mode for nothing — and Caddy reaches it as
  #    `presentation:80` on the normal network either way
  #    (see Caddyfile.internal.prod).
  presentation:
    pull_policy: build

  # `seed-users` is parked behind the prod-demo-users profile above, so it is
  # not part of this stack. depends_on entries are merged, not replaced, which
  # would leave `ready` waiting on a service compose never starts — hence the
  # full list is restated here with !override and that one entry dropped.
  # Everything else is identical to the base file; keep the two in sync.
  ready:
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      seed-roadmap:
        condition: service_completed_successfully
      seed-cards:
        condition: service_completed_successfully
      seed-pattern-content:
        condition: service_completed_successfully
      seed-pattern-cards:
        condition: service_completed_successfully
      seed-atlas:
        condition: service_completed_successfully
      seed-subpattern-cards:
        condition: service_completed_successfully
      api:
        condition: service_started
      web:
        condition: service_started
      presentation:
        condition: service_healthy
      caddy:
        condition: service_started

  # Route through vpngw:8080 instead of api:8080 — see Caddyfile.internal.prod.
  # depends_on presentation is inherited from the base file and still applies
  # here: the deck is started with the stack, but Caddy is not gated on it.
  caddy:
    volumes:
      - ./Caddyfile.internal.prod:/etc/caddy/Caddyfile:ro

networks:
  realgo-mail:
    name: realgo-mail-internal
    external: true
