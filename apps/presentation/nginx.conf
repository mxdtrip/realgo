# Static server for the final product presentation.
#
# This container sits behind the stack's Caddy, which strips the public
# `/presentation` prefix (`handle_path`) before proxying here — so everything
# below is written against the deck's own root, exactly as when the image is
# run standalone on :80. The deck references all of its assets relatively
# (`assets/...`, `vendor/...`), which is why the same files work at `/` and at
# `/presentation/` with no build step; Caddy redirects the bare
# `/presentation` to `/presentation/` so those relative URLs resolve.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
# apple.css (~200 KB), deck.js (~90 KB) and assets/product-ui.js (~420 KB) are
# the deck's weight; media below is already compressed and is left alone.
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cheap target for the Docker HEALTHCHECK: polling index.html every 15s would
  # otherwise re-read ~75 KB from disk for no reason.
  location = /healthz {
    access_log off;
    add_header Content-Type "text/plain" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "ok\n";
  }

  # NOTE on add_header inheritance: a location that declares any add_header of
  # its own drops every add_header inherited from the server block. That is why
  # the security headers are repeated in each location below instead of being
  # declared once at server level.

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Long-lived, content-heavy assets. index.html busts these with `?v=` query
  # params when a slide asset is replaced, so a week of caching is safe.
  location ~* \.(?:svg|png|jpe?g|webp|woff2?|glb|mp4|webm)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Code is deliberately uncached: the deck gets patched right up to a talk and
  # a stale apple.css or deck.js is a broken presentation on stage.
  location ~* \.(?:css|js|mjs)$ {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
