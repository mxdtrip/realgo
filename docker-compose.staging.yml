# Staging overlay for the appbox server, merged on top of docker-compose.yml:
# `docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile prod-demo up -d --build`
#
# This is the ReAlgo staging deploy target: a second, fully isolated copy of
# the product stack running alongside production
# on the same docker daemon. Isolation comes from the project name below (own
# containers/network/volumes, so its pgdata never touches prod data) plus
# non-colliding host ports. Exposed to the internet as staging.realgo.dev
# through the same VPS edge (frps:8081, see frpc.staging.toml).
#
# Differences from prod on purpose:
#   - no vpngw: staging runs without the VLESS egress tunnel, so AI card
#     generation is disabled here (GEMINI_API_KEY stays unset).
#   - frpc registers its own tunnel proxy (remotePort 8081) and does NOT
#     carry the homeserver-ssh proxy — prod's frpc already holds :2222.
#   - seed jobs are parked behind a never-enabled profile (see below).

name: realgo-staging

services:
  mail-relay:
    build:
      context: ./services/smtp-relay
    restart: unless-stopped
    environment:
      RELAY_SMTP_HOST: ${SMTP2GO_SMTP_HOST:-mail.smtp2go.com}
      RELAY_SMTP_PORT: ${SMTP2GO_SMTP_PORT:-2525}
      RELAY_SMTP_USERNAME: ${SMTP2GO_SMTP_USERNAME:?SMTP2GO_SMTP_USERNAME must be set}
      RELAY_SMTP_PASSWORD: ${SMTP2GO_SMTP_PASSWORD:?SMTP2GO_SMTP_PASSWORD must be set}
      SENDER_ADDRESS: noreply@realgo.dev
      RELAY_CLIENT_HOST: api
    networks: [mail-delivery, mail-egress]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    networks: [default, mail-delivery]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    depends_on:
      mail-relay:
        condition: service_started
      seed-company-atlas:
        condition: service_completed_successfully
    environment:
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SMTP_HOST: mail-relay
      MAIL_SMTP_PORT: "2526"
      MAIL_SMTP_TLS_MODE: none
      MAIL_BASE_URL: ${MAIL_BASE_URL:-https://test.realgo.dev}
      MAIL_SMTP_TIMEOUT: ${MAIL_SMTP_TIMEOUT:-10s}

  # Staging's content comes from a restored prod DB snapshot, not from the
  # seed fixtures — so every seed job is parked behind a profile the deploy
  # workflow never enables. Without this they would re-run on EVERY deploy on
  # top of real user rows; the seeds are meant to be idempotent since #215,
  # but that is exactly the class of bug that once wiped user progress in
  # prod, and there is no reason to re-take the risk on data we did not
  # generate. Nothing outside this group depends on them (api/web/caddy only
  # need postgres/redis/migrate), so parking them changes no other wiring.
  #
  # `migrate` deliberately stays ON: the snapshot carries the schema plus its
  # schema_migrations table, so migrate is a no-op when staging is level with
  # the dump, and correctly applies the delta when the fork adds migrations.
  #
  # To load fixtures into staging on purpose (e.g. a from-scratch DB with no
  # snapshot), add `--profile seeds` to the compose command.
  seed-roadmap:
    profiles: ["seeds"]
  seed-cards:
    profiles: ["seeds"]
  seed-pattern-content:
    profiles: ["seeds"]
  seed-pattern-cards:
    profiles: ["seeds"]
  seed-atlas:
    profiles: ["seeds"]
  seed-subpattern-cards:
    profiles: ["seeds"]
  seed-users:
    profiles: ["seeds"]

  # The restored snapshot deliberately does not run general demo seeds: they
  # can alter user-facing fixture data. Company discovery and the Atlas are an
  # exception: these scripts only upsert the public dataset layer and derive
  # its relevance rows. They preserve users, progress, manual/community rows
  # and cards, while ensuring a fresh restored staging database has a usable
  # company catalog before the API accepts traffic.
  seed-company-atlas:
    image: freeburger-seeds:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-image:
        condition: service_completed_successfully
    working_dir: /seeds
    volumes:
      - ./services/api/seeds:/seeds:ro
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-freeburger}?sslmode=disable
    command: >-
      sh -ec 'python seed_atlas.py atlas_content.yaml atlas_problem_links.yaml atlas_demo_companies.yaml
      && python seed_atlas_corpus.py atlas_corpus_problems.yaml
      && python seed_atlas_corpus.py atlas_gap_ledger_problems.yaml
      && python seed_company_problems.py atlas_company_problems.csv.gz
      && python seed_gfg_company_problems.py atlas_gfg_company_problems.csv.gz'
    restart: "no"

  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"

  redis:
    ports: !override
      - "127.0.0.1:6380:6379"

  caddy:
    ports: !override
      - "8081:80"

  # No `presentation` override on purpose: the base definition needs nothing
  # environment-specific, and it publishes no host port, so it cannot collide
  # with the prod stack sharing this docker daemon. It is built and started by
  # inheritance, and reached at staging.realgo.dev/presentation/ through this
  # stack's own caddy — verify with `docker compose ps presentation`.

  # Every seed job is parked behind the unused `seeds` profile above, so none
  # of them exist in this stack. depends_on entries merge rather than replace,
  # which would leave the readiness banner waiting forever on services compose
  # never starts — so the list is restated here with only what staging runs.
  # The banner's own HTTP probes are unaffected: they go through this stack's
  # caddy on :8081 (PUBLIC_PORT follows API_PORT, overridden below).
  ready:
    depends_on: !override
      startup-clock:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      web:
        condition: service_started
      presentation:
        condition: service_healthy
      caddy:
        condition: service_started
    environment:
      PUBLIC_PORT: "8081"

  frpc:
    volumes: !override
      - ./frpc.staging.toml:/etc/frp/frpc.toml:ro

networks:
  mail-delivery:
    internal: true
  mail-egress: {}
