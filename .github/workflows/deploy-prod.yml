name: Deploy prod
# ReAlgo production deploy: every push to main rebuilds the existing compose
# project on appbox that serves realgo.dev. The compose project and container
# names remain unchanged for compatibility with the current production volumes.
#
# Separate file from deploy.yml on purpose: that workflow owns push:[dev] for
# the isolated staging stack. This file only handles main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "'deploy' (default) rebuilds and restarts; 'verify-env' checks GitHub settings without changing containers; 'logs' tails the running api container; 'curl' probes Groq connectivity from the same docker network"
        required: false
        default: "deploy"
      grep:
        description: "logs mode only: case-insensitive pattern to filter for (empty = full tail)"
        required: false
        default: "ai:"
      since:
        description: "logs mode only: how far back to look (docker --since duration, e.g. 10m, 1h)"
        required: false
        default: "15m"
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: [self-hosted, linux, appbox]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Build & start
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl')
        env:
          # Версия сборки, видна в интерфейсе
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
          APP_VERSION: production-${{ github.run_number }}
          # SHA коммита, из которого собрана версия
          COMMIT_SHA: ${{ github.sha }}
          # Пользователь PostgreSQL (менять только вместе с существующим томом БД)
          DEPLOY_DB_USER: ${{ vars.DB_USER }}
          # Пароль PostgreSQL (применяется только при первой инициализации тома)
          DEPLOY_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Имя базы данных PostgreSQL
          DEPLOY_DB_NAME: ${{ vars.DB_NAME }}
          # Порт PostgreSQL на localhost хоста (по умолчанию 5432)
          DEPLOY_DB_PORT: ${{ vars.DB_PORT }}
          # Пароль Redis
          DEPLOY_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          # Preserve the existing Redis auth mode during credential migration.
          DEPLOY_REDIS_AUTH_ENABLED: ${{ vars.REDIS_AUTH_ENABLED || 'true' }}
          # Порт Redis на localhost хоста (по умолчанию 6379)
          DEPLOY_REDIS_PORT: ${{ vars.REDIS_PORT }}
          # Опубликованный порт caddy на хосте (по умолчанию 8080)
          DEPLOY_API_PORT: ${{ vars.API_PORT }}
          # Секрет подписи JWT, минимум 32 символа (смена разлогинит всех)
          DEPLOY_AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          # Время жизни access-токена (по умолчанию 15m)
          DEPLOY_AUTH_ACCESS_TTL: ${{ vars.AUTH_ACCESS_TTL }}
          # Время жизни refresh-токена (по умолчанию 720h)
          DEPLOY_AUTH_REFRESH_TTL: ${{ vars.AUTH_REFRESH_TTL }}
          # Адрес VPS с frps для reverse-туннеля
          DEPLOY_FRP_VPS_HOST: ${{ vars.FRP_VPS_HOST }}
          # Общий токен авторизации frp, должен совпадать с VPS
          DEPLOY_FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          # Пароль демо-аккаунтов; обязателен при ручном запуске prod-demo-users
          DEPLOY_SEED_USERS_PASSWORD: ${{ secrets.SEED_USERS_PASSWORD }}
          # Ключ AI-провайдера (сейчас Groq); пусто — генерация карточек отключена
          DEPLOY_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Модель для генерации карточек (по умолчанию llama-3.3-70b-versatile)
          DEPLOY_AI_MODEL: ${{ vars.AI_MODEL }}
          # Базовый URL OpenAI-совместимого AI API (по умолчанию https://api.groq.com/openai/v1)
          DEPLOY_AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          # Включает отправку писем; по умолчанию true, если заданы логин и пароль SMTP2GO
          DEPLOY_MAIL_ENABLED: ${{ vars.MAIL_ENABLED || (secrets.SMTP2GO_SMTP_USERNAME != '' && secrets.SMTP2GO_SMTP_PASSWORD != '') }}
          # Публичный URL сайта для ссылок в письмах, CSRF и cookie (по умолчанию https://realgo.dev)
          DEPLOY_MAIL_BASE_URL: ${{ vars.MAIL_BASE_URL || 'https://realgo.dev' }}
          # Таймаут SMTP-соединения (по умолчанию 10s)
          DEPLOY_MAIL_SMTP_TIMEOUT: ${{ vars.MAIL_SMTP_TIMEOUT }}
          # Хост SMTP2GO (по умолчанию mail.smtp2go.com)
          DEPLOY_SMTP2GO_SMTP_HOST: ${{ vars.SMTP2GO_SMTP_HOST }}
          # Порт SMTP2GO (по умолчанию 2525)
          DEPLOY_SMTP2GO_SMTP_PORT: ${{ vars.SMTP2GO_SMTP_PORT }}
          # Режим TLS relay -> SMTP2GO (по умолчанию starttls)
          DEPLOY_SMTP2GO_SMTP_TLS_MODE: ${{ vars.SMTP2GO_SMTP_TLS_MODE }}
          # Логин SMTP2GO (обязателен для mail-relay)
          DEPLOY_SMTP2GO_SMTP_USERNAME: ${{ secrets.SMTP2GO_SMTP_USERNAME }}
          # Пароль SMTP2GO (обязателен для mail-relay)
          DEPLOY_SMTP2GO_SMTP_PASSWORD: ${{ secrets.SMTP2GO_SMTP_PASSWORD }}
          # Client ID входа через Яндекс (публичный, попадает в сборку web); пусто — кнопка отключена
          DEPLOY_YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
          # Client Secret входа через Яндекс (только для API)
          DEPLOY_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          # Client ID входа через GitHub (публичный, попадает в сборку web); имя настройки GitHub не может начинаться с GITHUB_
          DEPLOY_GITHUB_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          # Client Secret входа через GitHub (только для API)
          DEPLOY_GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          # Логин первого администратора GoAdmin (задаётся до первого старта API)
          DEPLOY_GOADMIN_USERNAME: ${{ vars.GOADMIN_USERNAME }}
          # Пароль первого администратора GoAdmin, 12-72 байта
          DEPLOY_GOADMIN_PASSWORD: ${{ secrets.GOADMIN_PASSWORD }}
          # VLESS-подписка для шлюза vpngw (через него API ходит к AI-провайдеру)
          DEPLOY_VPN_SUB_URL: ${{ secrets.VPN_SUB_URL }}
          # CIDR прокси, чьему X-Forwarded-For доверяет rate limiter (по умолчанию частные сети)
          DEPLOY_TRUSTED_PROXY_CIDRS: ${{ vars.TRUSTED_PROXY_CIDRS }}
          # Origin расширения Chrome, которому разрешён CORS
          DEPLOY_REALGO_EXTENSION_ORIGIN: ${{ vars.REALGO_EXTENSION_ORIGIN }}
          # Базовый URL API, вшиваемый в web; пусто — относительные URL (тот же origin)
          DEPLOY_NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          # FSRS: целевая вероятность вспомнить карточку (по умолчанию 0.9)
          DEPLOY_FSRS_REQUEST_RETENTION: ${{ vars.FSRS_REQUEST_RETENTION }}
          # FSRS: максимальный интервал между повторами в днях (по умолчанию 36500)
          DEPLOY_FSRS_MAXIMUM_INTERVAL: ${{ vars.FSRS_MAXIMUM_INTERVAL }}
          # FSRS: включает краткосрочное планирование (по умолчанию true)
          DEPLOY_FSRS_ENABLE_SHORT_TERM: ${{ vars.FSRS_ENABLE_SHORT_TERM }}
          # FSRS: включает случайный разброс интервалов (по умолчанию false)
          DEPLOY_FSRS_ENABLE_FUZZ: ${{ vars.FSRS_ENABLE_FUZZ }}
          # Сколько секунд ждать готовности стека в итоговом баннере (по умолчанию 180)
          DEPLOY_READY_TIMEOUT: ${{ vars.READY_TIMEOUT }}
        run: |
          if [ "$DEPLOY_MODE" = verify-env ]; then
            source deploy/prepare-env.sh production verify-secrets
            exit 0
          fi
          source deploy/prepare-env.sh production
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.prod.yml pull --ignore-buildable || true
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.prod.yml --profile prod-demo up -d --build --remove-orphans

          # Caddy parses its Caddyfile ONCE, at process start. The file is a
          # read-only bind mount, so editing it changes nothing for a container
          # that is already running — and `up -d` only recreates a container
          # when its service *definition* changes, which a mounted file is not
          # part of. The result is an edge silently serving a stale routing
          # table (this is what made /presentation 404 on staging: the request
          # fell through to the Next.js catch-all, the only thing in this stack
          # that answers 404 — a missing deck container would have been a 502).
          #
          # Recreating just the edge is cheap and removes the whole class of
          # "config on disk ≠ config in memory". --no-deps so this does not
          # churn the app containers behind it.
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.prod.yml --profile prod-demo up -d --force-recreate --no-deps caddy

      - name: Verify presentation routing
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl' && inputs.mode != 'verify-env')
        run: |
          # The deck is a separate nginx container that Caddy exposes at
          # /presentation/ by stripping the prefix. Two things can silently
          # break without any container looking unhealthy, so both are probed
          # here against the local Caddy rather than the public domain:
          #
          #  1. the bare-path redirect. Without it the browser resolves the
          #     deck's relative assets (and its Three.js importmap) against the
          #     site root, and the slides load with no styles and no 3D scene.
          #  2. a nested asset. A 200 on index.html alone would still pass if
          #     the prefix strip were misconfigured, because nginx's SPA
          #     fallback answers index.html for unknown paths.
          #
          # The port comes from the resolved API_PORT setting (same default as
          # `${API_PORT:-8080}` in docker-compose.yml) rather than from
          # `docker compose port`: any compose subcommand re-parses the compose
          # file, which fails in a step without the secrets env block above
          # (AUTH_JWT_SECRET is declared `:?`, so it must resolve even to print
          # a port number).
          base="http://127.0.0.1:${REALGO_DEPLOY_API_PORT}"

          # Retried, not probed once: the deck image carries a HEALTHCHECK with
          # a 5s start period, so a single shot right after `up` races the
          # container coming up and would fail for a reason unrelated to the
          # routing being tested.
          probe() {
            label="$1"; url="$2"; want="$3"
            for _ in $(seq 1 15); do
              # A connection reset while Caddy is being recreated is an
              # expected transient state. `|| true` keeps `bash -e` from
              # aborting the function before the remaining retries run.
              code="$(curl -sS --connect-timeout 3 --max-time 10 -o /dev/null -w '%{http_code}' "$url" || true)"
              [ -n "$code" ] || code="000"
              [ "$code" = "$want" ] && { echo "$label: $code"; return 0; }
              sleep 2
            done
            echo "$label: $code (ожидали $want) -> $url" >&2
            # 404 здесь означает, что запрос дошёл до Next через catch-all,
            # то есть caddy работает со старой конфигурацией. 502 означал бы,
            # что маршрут есть, а контейнер презентации не поднялся.
            return 1
          }
          probe "bare path" "$base/presentation" 308
          probe "index"     "$base/presentation/" 200
          probe "asset"     "$base/presentation/vendor/three/three.module.min.js" 200

      - name: Verify AI wiring
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl' && inputs.mode != 'verify-env')
        run: |
          sleep 3
          # Plain `docker logs` by container name — NOT `docker compose logs`,
          # which re-parses the whole compose file (and would fail here the
          # same way `docker compose ps`/`logs` do in any step that lacks the
          # secrets env block from "Build & start": every docker-compose.yml
          # variable, not just the ones this step cares about, must resolve).
          container=$(docker ps --filter "name=freeburger-api-1" --format "{{.Names}}" | head -n1)
          if [ -z "$container" ]; then
            echo "api container not found by name filter"
          else
            docker logs "$container" --since 60s 2>&1 | grep -i "ai features" || echo "no 'ai features' log line found — api may still be starting"
          fi
      - name: Tail logs on demand
        # Lets a stuck/failed request be inspected without rebuilding — a
        # rebuild recreates the api container and its log buffer, which would
        # destroy the very evidence we're trying to look at.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'logs'
        run: |
          container=$(docker ps --filter "name=freeburger-api-1" --format "{{.Names}}" | head -n1)
          if [ -z "$container" ]; then
            echo "api container not found by name filter"
            exit 0
          fi
          pattern='${{ inputs.grep }}'
          since='${{ inputs.since }}'
          if [ -z "$pattern" ]; then
            docker logs "$container" --since "$since" 2>&1 | tail -n 200
          else
            docker logs "$container" --since "$since" 2>&1 | grep -i -- "$pattern" | tail -n 200 || echo "no lines matched '$pattern' in the last $since"
          fi
      - name: Probe Groq connectivity
        # Repeated 403 Forbidden from Groq across two different keys and two
        # different models, from both this network and the RuVDS VPS, pointed
        # to Cloudflare bot-managing this IP/ASN space rather than anything
        # wrong in the request — hence vpngw's VLESS tunnel. This probe joins
        # vpngw's netns directly so it's subject to the same iptables egress
        # redirect api's traffic is, confirming the tunnel actually routes
        # around the block (expect 200 here, not 403).
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'curl'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # api has no network attachment of its own (network_mode: service:vpngw),
          # so join vpngw's netns directly — that's the only way this probe is
          # actually subject to the same iptables tunnel redirect api's traffic is.
          container=$(docker ps --filter "name=freeburger-vpngw-1" --format "{{.Names}}" | head -n1)
          if [ -z "$container" ]; then
            echo "vpngw container not found by name filter"
            exit 0
          fi
          echo "Joining netns of: $container"
          docker run --rm --network "container:$container" -e GEMINI_API_KEY curlimages/curl:8.11.0 sh -c '
            curl -sS -D - -o /tmp/body \
              -X POST https://api.groq.com/openai/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: realgo-assistant/1.0 (+https://realgo.dev)" \
              -H "Authorization: Bearer $GEMINI_API_KEY" \
              -d "{\"model\":\"llama-3.3-70b-versatile\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}"
            echo "--- body ---"
            cat /tmp/body
          ' 2>&1 || true
      - name: Prune old images
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl' && inputs.mode != 'verify-env')
        run: docker image prune -f
