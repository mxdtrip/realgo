name: Deploy prod
# ReAlgo production deploy: every push to main rebuilds the existing compose
# project on appbox that serves realgo.dev. The compose project and container
# names remain unchanged for compatibility with the current production volumes.
#
# Separate file from deploy.yml on purpose: that workflow owns push:[dev] for
# the isolated staging stack. This file only handles main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "'deploy' (default) rebuilds and restarts; 'logs' tails the running api container; 'curl' probes Groq connectivity from the same docker network"
        required: false
        default: "deploy"
      grep:
        description: "logs mode only: case-insensitive pattern to filter for (empty = full tail)"
        required: false
        default: "ai:"
      since:
        description: "logs mode only: how far back to look (docker --since duration, e.g. 10m, 1h)"
        required: false
        default: "15m"
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, appbox]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build & start
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl')
        env:
          APP_VERSION: production-${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          FRP_VPS_HOST: ${{ secrets.FRP_VPS_HOST }}
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          # Password for the re-seeded demo accounts. Optional: when the secret
          # is unset the seed falls back to its local default (see DEMO.md).
          SEED_USERS_PASSWORD: ${{ secrets.SEED_USERS_PASSWORD }}
          # Gemini key for AI card generation. Optional: when unset the api
          # boots normally with generation disabled.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Domain mailbox for all transactional and product mail. The API
          # rejects any sender identity other than support@realgo.dev.
          MAIL_ENABLED: ${{ secrets.MAIL_SMTP_PASSWORD != '' }}
          MAIL_SMTP_HOST: mail.realgo.dev
          MAIL_SMTP_PORT: "587"
          MAIL_SMTP_USERNAME: support@realgo.dev
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_BASE_URL: https://realgo.dev
          MAIL_SMTP_TIMEOUT: 10s
          # VLESS subscription for the vpngw gateway (api shares its netns so
          # Groq calls ride this tunnel instead of the ISP's flagged egress).
          VPN_SUB_URL: ${{ secrets.VPN_SUB_URL }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --ignore-buildable || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod-demo up -d --build --remove-orphans

          # Caddy parses its Caddyfile ONCE, at process start. The file is a
          # read-only bind mount, so editing it changes nothing for a container
          # that is already running — and `up -d` only recreates a container
          # when its service *definition* changes, which a mounted file is not
          # part of. The result is an edge silently serving a stale routing
          # table (this is what made /presentation 404 on staging: the request
          # fell through to the Next.js catch-all, the only thing in this stack
          # that answers 404 — a missing deck container would have been a 502).
          #
          # Recreating just the edge is cheap and removes the whole class of
          # "config on disk ≠ config in memory". --no-deps so this does not
          # churn the app containers behind it.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod-demo up -d --force-recreate --no-deps caddy

      - name: Verify presentation routing
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl')
        run: |
          # The deck is a separate nginx container that Caddy exposes at
          # /presentation/ by stripping the prefix. Two things can silently
          # break without any container looking unhealthy, so both are probed
          # here against the local Caddy rather than the public domain:
          #
          #  1. the bare-path redirect. Without it the browser resolves the
          #     deck's relative assets (and its Three.js importmap) against the
          #     site root, and the slides load with no styles and no 3D scene.
          #  2. a nested asset. A 200 on index.html alone would still pass if
          #     the prefix strip were misconfigured, because nginx's SPA
          #     fallback answers index.html for unknown paths.
          #
          # The port is hardcoded rather than read from `docker compose port`
          # for the same reason the next step uses plain `docker logs`: any
          # compose subcommand re-parses the compose file, which fails in a
          # step without the secrets env block above (AUTH_JWT_SECRET is
          # declared `:?`, so it must resolve even to print a port number).
          # 8080 is caddy's published port — `${API_PORT:-8080}` in
          # docker-compose.yml, and the deploy environment does not set it.
          base="http://127.0.0.1:8080"

          # Retried, not probed once: the deck image carries a HEALTHCHECK with
          # a 5s start period, so a single shot right after `up` races the
          # container coming up and would fail for a reason unrelated to the
          # routing being tested.
          probe() {
            label="$1"; url="$2"; want="$3"
            for _ in $(seq 1 15); do
              # A connection reset while Caddy is being recreated is an
              # expected transient state. `|| true` keeps `bash -e` from
              # aborting the function before the remaining retries run.
              code="$(curl -sS --connect-timeout 3 --max-time 10 -o /dev/null -w '%{http_code}' "$url" || true)"
              [ -n "$code" ] || code="000"
              [ "$code" = "$want" ] && { echo "$label: $code"; return 0; }
              sleep 2
            done
            echo "$label: $code (ожидали $want) -> $url" >&2
            # 404 здесь означает, что запрос дошёл до Next через catch-all,
            # то есть caddy работает со старой конфигурацией. 502 означал бы,
            # что маршрут есть, а контейнер презентации не поднялся.
            return 1
          }
          probe "bare path" "$base/presentation" 308
          probe "index"     "$base/presentation/" 200
          probe "asset"     "$base/presentation/vendor/three/three.module.min.js" 200

      - name: Verify AI wiring
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl')
        run: |
          sleep 3
          # Plain `docker logs` by container name — NOT `docker compose logs`,
          # which re-parses the whole compose file (and would fail here the
          # same way `docker compose ps`/`logs` do in any step that lacks the
          # secrets env block from "Build & start": every docker-compose.yml
          # variable, not just the ones this step cares about, must resolve).
          container=$(docker ps --filter "name=freeburger-api-1" --format "{{.Names}}" | head -n1)
          if [ -z "$container" ]; then
            echo "api container not found by name filter"
          else
            docker logs "$container" --since 60s 2>&1 | grep -i "ai features" || echo "no 'ai features' log line found — api may still be starting"
          fi
      - name: Tail logs on demand
        # Lets a stuck/failed request be inspected without rebuilding — a
        # rebuild recreates the api container and its log buffer, which would
        # destroy the very evidence we're trying to look at.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'logs'
        run: |
          container=$(docker ps --filter "name=freeburger-api-1" --format "{{.Names}}" | head -n1)
          if [ -z "$container" ]; then
            echo "api container not found by name filter"
            exit 0
          fi
          pattern='${{ inputs.grep }}'
          since='${{ inputs.since }}'
          if [ -z "$pattern" ]; then
            docker logs "$container" --since "$since" 2>&1 | tail -n 200
          else
            docker logs "$container" --since "$since" 2>&1 | grep -i -- "$pattern" | tail -n 200 || echo "no lines matched '$pattern' in the last $since"
          fi
      - name: Probe Groq connectivity
        # Repeated 403 Forbidden from Groq across two different keys and two
        # different models, from both this network and the RuVDS VPS, pointed
        # to Cloudflare bot-managing this IP/ASN space rather than anything
        # wrong in the request — hence vpngw's VLESS tunnel. This probe joins
        # vpngw's netns directly so it's subject to the same iptables egress
        # redirect api's traffic is, confirming the tunnel actually routes
        # around the block (expect 200 here, not 403).
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'curl'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # api has no network attachment of its own (network_mode: service:vpngw),
          # so join vpngw's netns directly — that's the only way this probe is
          # actually subject to the same iptables tunnel redirect api's traffic is.
          container=$(docker ps --filter "name=freeburger-vpngw-1" --format "{{.Names}}" | head -n1)
          if [ -z "$container" ]; then
            echo "vpngw container not found by name filter"
            exit 0
          fi
          echo "Joining netns of: $container"
          docker run --rm --network "container:$container" -e GEMINI_API_KEY curlimages/curl:8.11.0 sh -c '
            curl -sS -D - -o /tmp/body \
              -X POST https://api.groq.com/openai/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "User-Agent: realgo-assistant/1.0 (+https://realgo.dev)" \
              -H "Authorization: Bearer $GEMINI_API_KEY" \
              -d "{\"model\":\"llama-3.3-70b-versatile\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}"
            echo "--- body ---"
            cat /tmp/body
          ' 2>&1 || true
      - name: Prune old images
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'logs' && inputs.mode != 'curl')
        run: docker image prune -f
