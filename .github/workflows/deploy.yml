name: Deploy staging
# Every push to dev rebuilds the isolated ReAlgo staging stack on appbox (see
# docker-compose.staging.yml), served as staging.realgo.dev via the VPS edge.
# Production is deployed independently from main by deploy-prod.yml.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, appbox]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build & start staging stack
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          FRP_VPS_HOST: ${{ secrets.FRP_VPS_HOST }}
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
          # No SEED_USERS_PASSWORD here on purpose: staging runs on a restored
          # prod snapshot and the seed jobs are parked behind an unused profile
          # (see docker-compose.staging.yml), so nothing would consume it.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile prod-demo pull --ignore-buildable || true
          docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile prod-demo up -d --build --remove-orphans

          # Caddy parses its Caddyfile ONCE, at process start. The file is a
          # read-only bind mount, so editing it changes nothing for a container
          # that is already running — and `up -d` only recreates a container
          # when its service *definition* changes, which a mounted file is not
          # part of. The result is an edge silently serving a stale routing
          # table: that is exactly how /presentation 404'd here (the request
          # fell through to the Next.js catch-all, which is the only thing in
          # this stack that answers 404 — a missing deck container would have
          # been a 502 instead).
          #
          # Recreating just the edge is cheap (Caddy restarts in milliseconds)
          # and removes the whole class of "config on disk ≠ config in memory".
          # --no-deps so this does not churn the app containers behind it.
          docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile prod-demo up -d --force-recreate --no-deps caddy

      - name: Smoke check
        run: |
          sleep 5
          # Through the staging caddy on its host port: / must be the web app,
          # /healthz must reach the api container.
          curl -fsS -o /dev/null -w "web: %{http_code}\n" http://127.0.0.1:8081/
          curl -fsS -o /dev/null -w "api: %{http_code}\n" http://127.0.0.1:8081/healthz
          # The deck lives in its own nginx container behind the same caddy.
          # Probing the bare path and a nested asset catches the two ways the
          # /presentation prefix strip breaks without any container going
          # unhealthy: a missing trailing-slash redirect (relative assets and
          # the Three.js importmap then resolve against the site root), and a
          # bad strip (nginx's SPA fallback would answer index.html with 200
          # for an asset path, so index.html alone proves nothing).
          #
          # Retried rather than probed once after a fixed `sleep 5`: the deck
          # image carries a HEALTHCHECK with a 5s start period, so a single
          # shot right after `up` races the container coming up and fails for
          # a reason that has nothing to do with the routing being tested.
          probe() {
            label="$1"; url="$2"; want="$3"
            for _ in $(seq 1 15); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
              [ "$code" = "$want" ] && { echo "$label: $code"; return 0; }
              sleep 2
            done
            echo "$label: $code (ожидали $want) -> $url" >&2
            # 404 здесь означает, что запрос дошёл до Next через catch-all,
            # то есть caddy работает со старой конфигурацией. 502 означал бы,
            # что маршрут есть, а контейнер презентации не поднялся.
            return 1
          }
          probe "deck redirect" http://127.0.0.1:8081/presentation 308
          probe "deck"          http://127.0.0.1:8081/presentation/ 200
          probe "deck asset"    http://127.0.0.1:8081/presentation/vendor/three/three.module.min.js 200

      - name: Prune old images
        run: docker image prune -f
