name: Предложить улучшение
description: Идея для продукта, документации или разработки
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает предложение?
      description: Опишите сценарий пользователя, а не только желаемую реализацию.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие обходные пути или другие варианты вы рассматривали?
  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
